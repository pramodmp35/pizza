<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>404 — Lost a Slice | STACKLY</title>
    <meta name="description" content="Oops! We couldn't find that page." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800;12..96,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              tomato: "#D62828",
              ember: "#FFC300",
              ink: "#0D0D0D",
              paper: "#FFFDF7",
            },
            fontFamily: {
              display: ['"Bricolage Grotesque"', "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      /* ============================================
       BASE / TOKENS
       ============================================ */
      :root {
        --tomato: #d62828;
        --tomato-dark: #8b1a1e;
        --ember: #ffc300;
        --ember-dark: #b8770d;
        --ink: #0d0d0d;
        --paper: #fffdf7;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Inter", sans-serif;
        background-color: var(--ink);
        color: #fff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ============================================
       404 PAGE LAYOUT
       ============================================ */
      .error-page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
        /* Changed to allow scrolling if screen is too short */
        overflow-x: hidden;
        overflow-y: auto;
        padding: 60px 16px; /* Added more vertical padding */
        isolation: isolate;
      }

      /* Background Pattern & Glow */
      .error-page::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(214, 40, 40, 0.25) 0%,
          transparent 60%
        );
        z-index: 1;
        pointer-events: none;
      }

      /* Checkered Strip top & bottom */
      .error-page::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 7px;
        background: conic-gradient(
          #d62828 90deg,
          #fffdf7 90deg 180deg,
          #d62828 180deg 270deg,
          #fffdf7 270deg
        );
        background-size: 14px 14px;
        z-index: 5;
      }
      .checker-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 7px;
        background: conic-gradient(
          #d62828 90deg,
          #fffdf7 90deg 180deg,
          #d62828 180deg 270deg,
          #fffdf7 270deg
        );
        background-size: 14px 14px;
        z-index: 5;
      }

      .error-content {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 600px;
        width: 100%;
        /* Pure CSS fade-in instead of AOS to guarantee visibility */
        animation: fadeInUp 0.8s ease-out forwards;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Floating Pizza */
      .floating-pizza {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.8));
        animation: float 4s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-15px) rotate(15deg);
        }
      }
      @media (min-width: 768px) {
        .floating-pizza {
          width: 160px;
          height: 160px;
          margin-bottom: 30px;
        }
      }

      /* Typography */
      .error-code {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 900;
        font-size: clamp(80px, 25vw, 160px);
        line-height: 0.8;
        letter-spacing: -0.04em;
        color: var(--ember);
        margin: 0 0 16px;
        text-shadow:
          0 4px 0 var(--tomato),
          0 15px 30px rgba(0, 0, 0, 0.6);
      }

      .error-title {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: clamp(20px, 5vw, 32px);
        margin: 0 0 12px;
        color: #fff;
      }

      .error-sub {
        font-size: clamp(14px, 3.5vw, 16px);
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.6;
        margin: 0 0 32px;
        padding: 0 10px;
      }

      /* ============================================
       BUTTONS
       ============================================ */
      .btn-group-custom {
        display: flex;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }
      @media (min-width: 576px) {
        .btn-group-custom {
          flex-direction: row;
          max-width: 100%;
        }
      }

      /* Base Button Styles */
      .btn-base {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 56px;
        padding: 0 24px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 14px;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: none;
        border-radius: 13px;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        appearance: none;
        -webkit-appearance: none;
      }

      /* Yellow Button (Go To Home) */
      .btn-yellow {
        color: var(--ink) !important;
        background: linear-gradient(
          180deg,
          #ffd54f 0%,
          #ffc300 45%,
          #e5a800 100%
        );
        box-shadow:
          0 5px 0 var(--ember-dark),
          0 9px 20px rgba(255, 195, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .btn-yellow:hover {
        transform: translateY(-2px);
        color: var(--ink) !important;
        box-shadow:
          0 7px 0 var(--ember-dark),
          0 13px 24px rgba(255, 195, 0, 0.5);
      }
      .btn-yellow:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 var(--ember-dark);
      }

      /* Red Button (Go Back) */
      .btn-slice {
        color: #fff !important;
        background: linear-gradient(
          180deg,
          #e63946 0%,
          #d62828 45%,
          #a81a1e 100%
        );
        box-shadow:
          0 5px 0 var(--tomato-dark),
          0 9px 20px rgba(214, 40, 40, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .btn-slice:hover {
        transform: translateY(-2px);
        color: #fff !important;
        box-shadow:
          0 7px 0 var(--tomato-dark),
          0 13px 24px rgba(214, 40, 40, 0.5);
      }
      .btn-slice:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 var(--tomato-dark);
      }

      /* Desktop Widths */
      @media (min-width: 576px) {
        .btn-base {
          width: auto;
          padding: 0 32px;
        }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="error-page">
      <div class="checker-top"></div>

      <div class="error-content">
        <!-- Floating Pizza SVG -->
        <div class="floating-pizza" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Crust -->
            <path
              d="M50 10 A40 40 0 0 0 50 90 Z"
              fill="#D69120"
              transform="rotate(90 50 50)"
            />
            <!-- Cheese/Sauce -->
            <path
              d="M50 18 A32 32 0 0 0 50 82 Z"
              fill="#FFC300"
              transform="rotate(90 50 50)"
            />
            <!-- Pepperoni -->
            <circle cx="50" cy="35" r="6" fill="#D62828" />
            <circle cx="40" cy="55" r="7" fill="#D62828" />
            <circle cx="60" cy="65" r="5" fill="#D62828" />
            <circle cx="50" cy="75" r="4" fill="#D62828" />
            <!-- Olives -->
            <circle cx="60" cy="45" r="3" fill="#0D0D0D" />
            <circle cx="45" cy="70" r="3" fill="#0D0D0D" />
          </svg>
        </div>

        <h1 class="error-code">404</h1>
        <h2 class="error-title">Looks like this slice is missing!</h2>
        <p class="error-sub">
          The page you're looking for has been eaten or moved. Let's get you
          back to the hot stuff.
        </p>

        <div class="btn-group-custom">
          <!-- GO BACK Button -->
          <button onclick="history.back()" class="btn-base btn-slice">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="width: 18px; height: 18px"
            >
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>
            Go Back
          </button>

          <!-- GO TO HOME Button -->
          <a href="./index.html" class="btn-base btn-yellow">
            Go To Home
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="width: 18px; height: 18px"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
