<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>STACKLY — Navigation</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800;12..96,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Preflight Off) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              tomato: "#D62828",
              ember: "#FFC300",
              ink: "#0D0D0D",
              paper: "#FFFDF7",
            },
            fontFamily: {
              display: ['"Bricolage Grotesque"', "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      /* ============================================
       BASE / TOKENS
       ============================================ */
      :root {
        --nav-height: 80px;
        --tomato: #d62828;
        --tomato-dark: #8b1a1e;
        --ember: #ffc300;
        --ember-dark: #b8770d;
        --ink: #0d0d0d;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background-color: var(--ink);
        color: #fff;
        -webkit-font-smoothing: antialiased;
        /* Dummy background for scroll testing */
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url("#");
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        min-height: 200vh; /* Force scrollbar */
      }

      /* ============================================
       NAVBAR STYLES
       ============================================ */
      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--nav-height);
        z-index: 1000;
        background: transparent;
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease,
          border-bottom 0.3s ease;
      }

      /* Solid background on scroll */
      .site-header.is-scrolled {
        background: rgba(13, 13, 13, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .nav-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 16px;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Logo */
      .brand-logo {
        display: block;
        text-decoration: none;
        z-index: 1001;
      }
      .logo-img {
        height: 40px;
        width: auto;
        object-fit: contain;
        /* Fallback style if image is missing */
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        min-width: 120px;
      }
      @media (min-width: 992px) {
        .logo-img {
          height: 48px;
        }
      }

      /* Desktop Nav */
      .desktop-nav {
        display: none;
      }
      @media (min-width: 992px) {
        .desktop-nav {
          display: block;
        }
      }

      .nav-links {
        display: flex;
        gap: 32px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-link {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        transition: color 0.2s ease;
        position: relative;
        padding: 8px 0;
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--ember);
      }

      /* Yellow dot for active link */
      .nav-link.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--ember);
      }

      /* Desktop Right Actions */
      .desktop-actions {
        display: none;
      }
      @media (min-width: 992px) {
        .desktop-actions {
          display: flex;
          align-items: center;
          gap: 24px;
        }
      }

      .nav-phone {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-decoration: none;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-weight: 600;
        transition: color 0.2s;
      }
      .nav-phone:hover {
        color: var(--ember);
      }
      .icon-sm {
        width: 16px;
        height: 16px;
        color: var(--ember);
      }

      .nav-order-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 24px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        background: linear-gradient(
          180deg,
          #e63946 0%,
          #d62828 45%,
          #a81a1a 100%
        );
        border-radius: 50px;
        text-decoration: none;
        box-shadow:
          0 4px 0 var(--tomato-dark),
          0 8px 16px rgba(214, 40, 40, 0.3);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .nav-order-btn:hover {
        transform: translateY(-2px);
        color: #fff;
        box-shadow:
          0 6px 0 var(--tomato-dark),
          0 12px 20px rgba(214, 40, 40, 0.5);
      }
      .nav-order-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--tomato-dark);
      }

      /* ============================================
       MOBILE HAMBURGER TOGGLE
       ============================================ */
      .mobile-toggle {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 20px;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 1001;
        padding: 0;
      }
      @media (min-width: 992px) {
        .mobile-toggle {
          display: none;
        }
      }

      .mobile-toggle span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: #fff;
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      /* ============================================
       MOBILE FULL-SCREEN MENU
       ============================================ */
      .mobile-menu {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-20px);
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease,
          transform 0.4s ease;
        overflow-y: auto;
      }

      .mobile-menu.is-open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .mobile-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--nav-height);
        margin-bottom: 20px;
      }

      .mobile-close {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        cursor: pointer;
        transition: all 0.2s;
      }
      .mobile-close:hover {
        background: var(--tomato);
        border-color: var(--tomato);
      }
      .mobile-close svg {
        width: 24px;
        height: 24px;
      }

      .mobile-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .mobile-links {
        list-style: none;
        padding: 0;
        margin: 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .mobile-link {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        transition: color 0.2s;
      }
      .mobile-link:hover,
      .mobile-link.active {
        color: var(--ember);
      }

      .mobile-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 40px;
        margin-top: auto;
      }
    </style>
  </head>

  <body>
    <!-- ============================================
       NAVBAR
       ============================================ -->
    <header class="site-header" id="siteHeader">
      <div class="nav-container">
        <!-- Logo -->
        <a href="./index.html" class="brand-logo" aria-label="STACKLY Home">
          <!-- REPLACE WITH YOUR LOGO SRC -->
          <img src="./assets/logo.webp" alt="STACKLY Logo" class="logo-img" />
        </a>

        <!-- Desktop Nav Links -->
        <nav class="desktop-nav" aria-label="Main Navigation">
          <ul class="nav-links">
            <li><a href="./index.html" class="nav-link active">Home</a></li>
            <li><a href="./about.html" class="nav-link">About Us</a></li>
            <li><a href="./menu.html" class="nav-link">Menu</a></li>
            <li><a href="./blog.html" class="nav-link">Blog</a></li>
            <li>
              <a href="./contact.html" class="nav-link">Contact Us</a>
            </li>
          </ul>
        </nav>

        <!-- Desktop Right Actions -->
        <div class="desktop-actions">
          <a href="./404.html" class="nav-phone">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon-sm"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"
              />
            </svg>
            +91 44 1234 5678
          </a>
          <a href="./login.html" class="nav-order-btn">LOGIN</a>
        </div>

        <!-- Mobile Hamburger Toggle -->
        <button
          class="mobile-toggle"
          id="mobileToggle"
          aria-label="Open Menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- ============================================
       MOBILE FULL-SCREEN MENU
       ============================================ -->
    <div class="mobile-menu" id="mobileMenu">
      <div class="mobile-menu-header">
        <a href="./index.html" class="brand-logo">
          <!-- REPLACE WITH YOUR LOGO SRC -->
          <img src="./assets/logo.webp" alt="STACKLY Logo" class="logo-img" />
        </a>
        <button class="mobile-close" id="mobileClose" aria-label="Close Menu">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <nav class="mobile-nav" aria-label="Mobile Navigation">
        <ul class="mobile-links">
          <li><a href="./index.html" class="mobile-link active">Home</a></li>
          <li><a href="./about.html" class="mobile-link">About Us</a></li>
          <li><a href="./menu.html" class="mobile-link">Menu</a></li>
          <li><a href="./blog.html" class="mobile-link">Blog</a></li>
          <li>
            <a href="./contact.html" class="mobile-link">Contact Us</a>
          </li>
        </ul>
      </nav>

      <div class="mobile-actions">
        <a
          href="./404.html"
          class="nav-phone"
          style="justify-content: center; margin-bottom: 20px"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon-sm"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"
            />
          </svg>
          +91 44 1234 5678
        </a>
        <a href="./login.html" class="nav-order-btn" style="width: 100%"
          >LOGIN</a
        >
      </div>
    </div>

    <!-- ============================================
       SCRIPTS
       ============================================ -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const header = document.getElementById("siteHeader");
        const mobileToggle = document.getElementById("mobileToggle");
        const mobileClose = document.getElementById("mobileClose");
        const mobileMenu = document.getElementById("mobileMenu");

        // 1. Scroll Header Effect
        window.addEventListener(
          "scroll",
          () => {
            if (window.scrollY > 20) {
              header.classList.add("is-scrolled");
            } else {
              header.classList.remove("is-scrolled");
            }
          },
          { passive: true },
        );

        // 2. Mobile Menu Toggle
        function openMenu() {
          mobileMenu.classList.add("is-open");
          mobileToggle.setAttribute("aria-expanded", "true");
          document.body.style.overflow = "hidden"; // Prevent body scroll
        }

        function closeMenu() {
          mobileMenu.classList.remove("is-open");
          mobileToggle.setAttribute("aria-expanded", "false");
          document.body.style.overflow = ""; // Restore body scroll
        }

        mobileToggle.addEventListener("click", openMenu);
        mobileClose.addEventListener("click", closeMenu);

        // Close menu when clicking a link
        const mobileLinks = document.querySelectorAll(
          ".mobile-link, .mobile-actions a",
        );
        mobileLinks.forEach((link) => {
          link.addEventListener("click", closeMenu);
        });

        // 3. Auto-set Active Link
        const currentPath =
          window.location.pathname.split("/").pop() || "index.html";

        const allLinks = document.querySelectorAll(".nav-link, .mobile-link");
        allLinks.forEach((link) => {
          const href = link.getAttribute("href");
          if (href && href.includes(currentPath)) {
            link.classList.add("active");
          } else if (currentPath === "" && href === "./index.html") {
            link.classList.add("active");
          } else {
            link.classList.remove("active");
          }
        });
      });
    </script>
  </body>
</html>
